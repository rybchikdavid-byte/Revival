plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wexresprise.revival'
    compileSdk 35

    defaultConfig {
        applicationId "com.wexresprise.revival"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore/wexresprise.p12")
            storePassword "wexresprise123"
            keyAlias "wexresprise"
            keyPassword "wexresprise123"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
